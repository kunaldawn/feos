[package]
name = "feos-opus"
description = "An Opus decoder: the pure-Rust opus-decoder crate, adapted for no_std"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]

# This crate reads untrusted input: a malformed file must be an error, not a panic.
# CI's clippy denies these (see `CLIPPY_FLAGS` in the Makefile).
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
string_slice = "warn"
