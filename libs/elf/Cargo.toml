[package]
name = "feos-elf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]

# This crate reads untrusted input: a malformed file must be an error, not a panic.
# CI's clippy denies these (see `CLIPPY_FLAGS` in the Makefile).
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
string_slice = "warn"
# The kernel loads user programs with this: the arithmetic and indexing are
# checked too, beyond the panic lints the other parsers have.
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
