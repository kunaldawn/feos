[package]
name = "feos-bootinfo"
description = "What a boot loader tells the kernel, and the parsing a loader needs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# This crate reads untrusted input: a malformed file must be an error, not a panic.
# CI's clippy denies these (see `CLIPPY_FLAGS` in the Makefile).
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
string_slice = "warn"
