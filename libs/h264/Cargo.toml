[package]
name = "feos-h264"
description = "A dependency-free, no_std H.264/AVC decoder for the feos kernel"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]

[features]
default = []
upstream-tests = []

# This crate reads untrusted input: a malformed file must be an error, not a panic.
# CI's clippy denies these (see `CLIPPY_FLAGS` in the Makefile).
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
string_slice = "warn"
