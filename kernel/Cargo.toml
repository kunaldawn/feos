[package]
name = "feos-kernel"
description = "The feos bootable kernel binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-2.0-or-later"

[[bin]]
name = "feos"
path = "src/main.rs"
# The kernel binary cannot be linked against a host test harness.
test = false
bench = false

[dependencies]
feos-abi = { workspace = true }
feos-app = { workspace = true }
feos-elf = { workspace = true }
feos-fs = { workspace = true }
feos-gfx = { workspace = true }
feos-gui = { workspace = true }
feos-vm = { workspace = true }
feos-apps = { workspace = true }
feos-console = { workspace = true }
feos-desktop-app = { workspace = true }
feos-hal = { workspace = true }
feos-frames = { workspace = true }
feos-heap = { workspace = true }
feos-irq = { workspace = true }
feos-net = { workspace = true }
feos-sched = { workspace = true }
feos-shell = { workspace = true }
feos-sync = { workspace = true }

# The kernel selects the architecture and board crate for the target. Building
# for `aarch64-unknown-none` wires in the `virt` board; building for
# `x86_64-feos` wires in the q35 board. No source-level board switch is
# needed.
[target.'cfg(target_arch = "aarch64")'.dependencies]
feos-arch-aarch64 = { workspace = true }
feos-board-qemu-virt = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
feos-arch-x86_64 = { workspace = true }
feos-board-qemu-x86_64 = { workspace = true }
