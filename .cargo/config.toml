[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
# `cargo run` builds and then hands the ELF to scripts/qemu.sh, which boots the
# `virt` machine with ramfb, the Intel HDA audio device and a QEMU audio
# backend. Set FEOS_DISPLAY / FEOS_AUDIODEV in the environment to override.
runner = "scripts/qemu.sh"
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=-Tboards/qemu-virt/linker.ld",
    "-C", "relocation-model=static",
    "-C", "link-arg=-z", "-C", "link-arg=max-page-size=4096",
]

[target.x86_64-unknown-none]
# `cargo run --target x86_64-unknown-none` hands the linked ELF to
# scripts/qemu-x64.sh, which turns it into the flat multiboot image QEMU
# expects and boots the q35 machine. The red zone is disabled because timer
# IRQs use the interrupted stack directly.
runner = "scripts/qemu-x64.sh"
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=-Tboards/qemu-x86_64/linker.ld",
    "-C", "relocation-model=static",
    "-C", "no-redzone=yes",
    "-C", "link-arg=-z", "-C", "link-arg=max-page-size=4096",
]
