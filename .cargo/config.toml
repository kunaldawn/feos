[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
# `cargo run` builds and then hands the ELF to scripts/qemu.sh, which boots the
# `virt` machine with ramfb, the Intel HDA audio device and a QEMU audio
# backend. Set FEOS_DISPLAY / FEOS_AUDIODEV in the environment to override.
runner = "scripts/qemu.sh"
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=-Tboards/qemu-virt/linker.ld",
    "-C", "relocation-model=static",
    "-C", "link-arg=-z", "-C", "link-arg=max-page-size=4096",
]

[target.x86_64-feos]
# The custom target in arch/x86_64/x86_64-feos.json: see `make build-x64` for how
# to build it. Cargo hands the linked ELF to scripts/qemu-x64.sh, which turns it
# into the flat multiboot image QEMU expects and boots the q35 machine.
runner = "scripts/qemu-x64.sh"
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "link-arg=-Tboards/qemu-x86_64/linker.ld",
    "-C", "relocation-model=static",
    # No red zone, as for any x86_64 kernel: code must not keep data below its
    # stack pointer where a trap could land. Every IDT gate switches to an IST
    # stack today, but nothing should depend on that. The target JSON already
    # sets `disable-redzone`; this repeats it. `aarch64-unknown-none` has no red
    # zone either, so the AArch64 flags don't need it.
    "-C", "no-redzone=yes",
    "-C", "link-arg=-z", "-C", "link-arg=max-page-size=4096",
]
