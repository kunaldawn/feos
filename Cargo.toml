[workspace]
resolver = "2"
members = [
    "kernel",
    "arch/*",
    "boot/*",
    "boards/*",
    "drivers/*/*",
    "libs/*",
    "apps/*",
]
# `cargo build` from the repository root builds the bootable kernel. Use
# `-p <crate>` (or `--workspace`) to build libraries, drivers and apps.
default-members = ["kernel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
feos-abi = { path = "libs/abi" }
feos-app = { path = "libs/app" }
feos-apps = { path = "apps/commands" }
feos-arch-aarch64 = { path = "arch/aarch64" }
feos-arch-x86_64 = { path = "arch/x86_64" }
feos-audio = { path = "libs/audio" }
feos-audio-codec = { path = "libs/audio-codec" }
feos-archive = { path = "libs/archive" }
feos-board-common = { path = "boards/common" }
feos-bootinfo = { path = "libs/bootinfo" }
feos-board-qemu-virt = { path = "boards/qemu-virt" }
feos-board-qemu-x86_64 = { path = "boards/qemu-x86_64" }
feos-bundle = { path = "libs/bundle" }
feos-compress = { path = "libs/compress" }
feos-console = { path = "libs/console" }
feos-coreutils = { path = "libs/coreutils" }
feos-desktop = { path = "libs/desktop" }
feos-desktop-app = { path = "apps/desktop" }
feos-dosbox = { path = "libs/dosbox" }
feos-elf = { path = "libs/elf" }
feos-vm = { path = "libs/vm" }
feos-dosbox-app = { path = "apps/dosbox" }
feos-driver-apic = { path = "drivers/interrupt/apic" }
feos-driver-fw-cfg = { path = "drivers/firmware/fw-cfg" }
feos-driver-gicv2 = { path = "drivers/interrupt/gicv2" }
feos-driver-gicv3 = { path = "drivers/interrupt/gicv3" }
feos-driver-i8042 = { path = "drivers/input/i8042" }
feos-driver-intel-hda = { path = "drivers/audio/intel-hda" }
feos-driver-pci = { path = "drivers/bus/pci" }
feos-driver-cmos-rtc = { path = "drivers/rtc/cmos" }
feos-driver-pl011 = { path = "drivers/serial/pl011" }
feos-driver-pl031 = { path = "drivers/rtc/pl031" }
feos-driver-ramfb = { path = "drivers/display/ramfb" }
feos-driver-uart16550 = { path = "drivers/serial/uart16550" }
feos-driver-virtio-blk = { path = "drivers/block/virtio" }
feos-driver-virtio-gpu = { path = "drivers/display/virtio-gpu" }
feos-driver-virtio-input = { path = "drivers/input/virtio" }
feos-driver-virtio-net = { path = "drivers/net/virtio" }
feos-driver-xhci = { path = "drivers/usb/xhci" }
feos-virtio-core = { path = "drivers/virtio/core" }
feos-gfx = { path = "libs/gfx" }
feos-firmware = { path = "libs/firmware" }
feos-frames = { path = "libs/frames" }
feos-fs = { path = "libs/fs" }
feos-gui = { path = "libs/gui" }
feos-h264 = { path = "libs/h264" }
feos-hal = { path = "libs/hal" }
feos-heap = { path = "libs/heap" }
feos-image = { path = "libs/image" }
feos-init = { path = "libs/init" }
feos-irq = { path = "libs/irq" }
feos-json = { path = "libs/json" }
feos-keys = { path = "libs/keys" }
feos-net = { path = "libs/net" }
feos-iconset = { path = "libs/iconset" }
feos-mixer = { path = "libs/mixer" }
feos-port-io = { path = "libs/port-io" }
feos-sched = { path = "libs/sched" }
feos-sh = { path = "libs/sh" }
feos-shell = { path = "apps/shell" }
feos-sync = { path = "libs/sync" }
feos-text = { path = "libs/text" }
feos-video = { path = "libs/video" }
feos-source = { path = "libs/source" }
feos-opus = { path = "libs/opus" }
feos-yaml = { path = "libs/yaml" }

# A kernel cannot unwind. These profiles apply to every workspace crate.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
# Line tables make panics and faults easier to trace, and aren't loaded.
debug = "line-tables-only"

# The image is dominated by data, so speed matters more than size in hot code.
[profile.release.package.feos-gfx]
opt-level = 3

[profile.release.package.feos-gui]
opt-level = 3

[profile.release.package.feos-desktop]
opt-level = 3

[profile.release.package.feos-dosbox]
opt-level = 3

[profile.release.package.feos-audio-codec]
opt-level = 3

[profile.release.package.feos-audio]
opt-level = 3

[profile.release.package.feos-mixer]
opt-level = 3

[profile.release.package.feos-opus]
opt-level = 3

[profile.release.package.feos-video]
opt-level = 3

[profile.release.package.feos-h264]
opt-level = 3
