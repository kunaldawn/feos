[package]
edition = "2021"
rust-version = "1.89"
name = "sirocco"
version = "0.2.0"
build = false
include = [
    "/src",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast DEFLATE, zlib and gzip decompression in pure Rust"
readme = "README.md"
keywords = [
    "deflate",
    "zlib",
    "gzip",
    "inflate",
    "decompression",
]
categories = [
    "compression",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/srijs/sirocco"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
alloc = []
default = ["std"]
std = [
    "alloc",
    "adler32furious/std",
    "crc32fast/std",
]

[lib]
name = "sirocco"
path = "src/lib.rs"
bench = false

[dependencies.adler32furious]
version = "0.1.1"
default-features = false

[dependencies.crc32fast]
version = "1.5"
default-features = false

[dev-dependencies.miniz_oxide]
version = "0.9"

[dev-dependencies.proptest]
version = "1"
features = [
    "std",
    "bit-set",
]
default-features = false

[lints.clippy]
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
dbg_macro = "warn"
doc_markdown = "allow"
enum_glob_use = "allow"
inline_always = "allow"
items_after_statements = "allow"
large_stack_arrays = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
